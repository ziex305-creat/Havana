<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HaVaNa Shop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="/site-polish.css">
    <script defer src="/site-language.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

</head>

<body>
    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1>Welcome To HaVaNa Shop</h1>
            <p>Sign in to access your account</p>
        </div>

        <form>
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password" id="forgotPasswordLink">Forgot Password?</a>
            </div>


            <div id="errorMessage" class="error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <button type="submit" class="login-button">LOGIN</button>

            <style>
                .message {
                    padding: 12px 20px;
                    border-radius: 8px;
                    margin: 10px 0;
                    display: flex;
                    align-items: center;
                    font-size: 14px;
                    font-weight: 500;
                    transition: all 0.3s ease;
                    opacity: 0.95;
                    border: 1px solid transparent;
                }
                
                .message i {
                    margin-right: 10px;
                    font-size: 18px;
                }
                
                .error-message {
                    background: rgba(255, 76, 48, 0.1);
                    color: #ff4c30;
                    padding: 14px 18px;
                    border-radius: 12px;
                    margin: 0 0 20px 0;
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    font-size: 14px;
                    border: 2px solid transparent;
                    animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1), pulseBorder 2s infinite;
                    box-shadow: 0 2px 15px rgba(255, 76, 48, 0.1);
                    backdrop-filter: blur(4px);
                    transition: all 0.3s ease;
                }
                
                .error-message i {
                    font-size: 20px;
                    color: #ff4c30;
                    flex-shrink: 0;
                }
                
                @keyframes slideDown {
                    from {
                        opacity: 0;
                        transform: translateY(-15px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }
                
                @keyframes pulseBorder {
                    0% {
                        border-color: rgba(255, 76, 48, 0.2);
                        box-shadow: 0 0 0 0 rgba(255, 76, 48, 0.7);
                    }
                    70% {
                        border-color: rgba(255, 76, 48, 0.1);
                        box-shadow: 0 0 0 6px rgba(255, 76, 48, 0);
                    }
                    100% {
                        border-color: rgba(255, 76, 48, 0.2);
                        box-shadow: 0 0 0 0 rgba(255, 76, 48, 0);
                    }
                }
                
                .error-message.fade-out {
                    animation: fadeOut 0.5s ease-out forwards, slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                }
                
                @keyframes fadeOut {
                    to {
                        opacity: 0;
                    }
                }
                
                @keyframes slideUp {
                    to {
                        transform: translateY(-10px);
                    }
                }
            </style>
        </form>



        <div class="signup-link">
            <p>Don't have an account? <a href="#" id="showSignup">Create Account</a></p>
        </div>
    </div>

    <div class="reset-password-container" id="resetPasswordContainer" style="display: none;">
        <div class="reset-password-header">
            <h1>Forgot Password</h1>
            <p>Enter your email to reset your password</p>
        </div>

        <form id="resetPasswordForm" onsubmit="sendResetCode(event)">
            <div class="input-group">
                <input type="email" id="resetEmail" name="email" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>
            <button type="submit" class="login-button">Send Reset Link</button>
            <div id="resetMessage" class="message" style="display: none; margin-top: 15px;">
                <i class="fas" id="messageIcon"></i>
                <span id="resetMessageText"></span>
            </div>
            <div class="back-to-login">
                <a href="#" id="backToLogin">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </form>
    </div>

    <div class="Sign-Up-container" id="signupContainer" style="display: none;">
        <div class="Sign-Up-header">
            <h1>Welcome</h1>
            <p>Sign Up to Access Your New Account</p>
        </div>
        <form>
            <div class="input-group">
                <input id="signupDisplayName" type="text" placeholder="Display name" autocomplete="name" required>

            </div>

            <div class="input-group">
                <input id="signupUsername" type="text" placeholder="@user_name" autocomplete="username" required>

            </div>

            <div class="input-group">
                <input id="signupEmail" type="email" placeholder="Email Address" autocomplete="email" required>

            </div>

            <div class="input-group">
                <input id="signupPassword" type="password" placeholder="Password" autocomplete="new-password" required>

            </div>

            <div class="input-group">
                <input id="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required>

            </div>
            <button type="submit" class="login-button">Create</button>


            <div class="back-to-login">

                <p><a href="#" id="backToLogin">Back to Login</a></p>
            </div>
        </form>
    </div>

    <script src="script.js"></script>


</body>

</html>
