            </div>
            <ul class="nav-links">
                <li><i class="fa-solid fa-house"></i><a href="../../index.html">Home</a></li>
                <li><i class="fa-solid fa-shirt"></i><a href="/links/Hoodies/hodies.html">HOODIES</a></li>
                <li><i class="fa-solid fa-shirt"></i><a href="/links/T-Sheirts/t-shirts.html">T-SHIRTS</a></li>
                <li><i class="fa-solid fa-dollar-sign"></i><a href="/index.html#discount">GET offer</a></li>
                <li><i class="fa-solid fa-phone"></i><a href="/links/Contact/contact.html">Contact</a></li>
                <ul class="links">
                    <li>
                        <li id="guestLinks">
    <a href="/links/Login/login.html">
        <i class="fa-solid fa-right-to-bracket"></i>
        Login
    </a>
</li>

<li id="userLinks" style="display:none;">
    <a href="/links/dashbboard/dashboard.html">
        <i class="fa-solid fa-user"></i>
        <span id="navUserName"></span>
    </a>

    <a href="#" id="logoutHome">

        Logout
    </a>
</li>
                        
                    </li>
                </ul>
            </ul>
        </div>
    </nav>
    <div class="product-container">
        <!-- LEFT IMAGES -->
        <div class="product-images">
            <img id="mainImage" src="" alt="Product Image" class="main-img">
            <div class="thumbnail-list" id="thumbnailList">
                <!-- الصور المصغرة سيتم إضافتها جافاسكريبت -->
            </div>
        </div>

        <!-- RIGHT DETAILS -->
        <div class="product-details">
            <h1 class="product-title" id="productName"></h1>

            <div class="price-container">
                <div id="productPrice" class="price"></div>
                <div id="originalPrice" class="original-price"></div>
            </div>

            <p class="product-description" id="productDesc"></p>

            

            <button class="buy-now-btn" id="buyNowBtn">
                <i class="fa-solid fa-bolt"></i> Buy Now
            </button>

            <button type="button" onclick="resetToOriginal()" class="reset-image-btn">
                Reset to Main Image
            </button>

            <!-- DISCOUNT CODE -->
            <div class="discount-box">
                <input type="text" id="discountInput" placeholder="Enter discount code">
                <button id="applyDiscountBtn">Apply</button>
            </div>

            <div class="final-price" id="finalPrice"></div>
        </div>
    </div>

    <script src="show.js"></script>
